<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mahdi's Date 💜</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>💜 Mahdi's Date</h1>

<p>
اگر فکر می‌کنی می‌تونیم یک خاطره قشنگ بسازیم،
درخواستت رو ثبت کن.
</p>

<div class="form">

<input type="text" placeholder="اسمت">

<input type="number" placeholder="چند سالته؟">

<input type="text" placeholder="شهرت">

<input type="text" placeholder="آیدی تلگرام یا اینستاگرام">

<select>

<option>نوع دیت را انتخاب کن</option>

<option>☕ کافه</option>

<option>🌃 رانندگی شب</option>

<option>🍕 رستوران</option>

<option>🎬 سینما</option>

<option>🌳 پیاده‌روی</option>

</select>

<input type="date">

<input type="time">

<textarea rows="4" placeholder="چرا دوست داری باهام بیرون بیای؟"></textarea>

<button onclick="sendForm()">
ارسال درخواست 💜
</button>

</div>

<div class="success">

<h2>💜 درخواستت ثبت شد</h2>

<p>
اگر حس کنم بینمون وایب خوبی وجود داره،
بهت پیام میدم.
</p>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
