<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت نام</title>

<style>
body{
    background:#090909;
    color:white;
    font-family:tahoma;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#181818;
    padding:25px;
    border-radius:20px;
    width:90%;
    max-width:350px;
    box-shadow:0 0 20px #8a2be2;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    padding:12px;
    background:#8a2be2;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h2>ثبت نام</h2>

<input type="text" placeholder="نام کاربری">

<input type="password" placeholder="رمز عبور">

<button>ثبت نام</button>

</div>

</body>
</html>
